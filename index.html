<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="点点手帐">
<meta name="theme-color" content="#F6EFE3">
<link rel="apple-touch-icon" href="./icon-dot.png?v=2">
<link rel="icon" type="image/png" href="./icon-dot.png?v=2">
<title>点点手帐 Dot</title>
<style>
  :root{
    --bg:#F6EFE3; --bg-deep:#EAE0CC; --card:#FFFDF6;
    --ink:#1F1C17; --ink-soft:#8A8171; --ink-faint:#B6AC99;
    --line:#E6DBC6; --accent:#F45D08; --accent-soft:#FBE7D4;
    --green:#5F8F66; --red:#C0604E; --badge-bg:#EFE7D3; --badge-ink:#8A7C5F;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg-deep);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    color:var(--ink); display:flex; justify-content:center;
    position:fixed; inset:0; width:100%; overflow:hidden;
    touch-action:manipulation; -webkit-text-size-adjust:100%;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  input,textarea{-webkit-user-select:text;user-select:text}
  .rp-text{-webkit-user-select:text;user-select:text}
  #phone{
    width:100%; max-width:430px; height:100dvh;
    background:var(--bg); position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,.08);
  }
  header{
    flex:none; display:flex; align-items:center; gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px; background:rgba(246,239,227,.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line); z-index:5;
  }
  .icon-btn{
    width:34px;height:34px;border:none;background:none;border-radius:10px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);font-size:16px;
  }
  .icon-btn:active{background:var(--accent-soft)}
  .hamburger{display:flex;flex-direction:column;gap:4.5px}
  .hamburger i{display:block;width:17px;height:1.8px;background:var(--ink);border-radius:2px}
  #topTitle{flex:1;font-size:17px;font-weight:700;letter-spacing:.5px}
  .pill-btn{
    border:1px solid var(--line);background:var(--card);color:var(--accent);
    font-size:13.5px;padding:7px 15px;border-radius:999px;cursor:pointer;font-weight:600;font-family:inherit;
  }
  .pill-btn:active{background:var(--accent-soft)}
  main{flex:1;overflow-y:auto;padding:4px 20px 150px;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  main::-webkit-scrollbar{display:none}
  .section-label{font-size:12px;color:var(--ink-faint);letter-spacing:3px;margin:22px 0 3px 2px;font-weight:600}
  .date-group{font-size:13px;color:var(--ink-soft);margin:18px 0 2px 2px;font-weight:600}
  /* ---------- 条目行 ---------- */
  .entry{display:flex;align-items:flex-start;gap:12px;padding:7px 0}
  .sym{
    flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
    margin-top:1px;cursor:pointer;border-radius:7px;
  }
  .sym.static{cursor:default}
  .sym:not(.static):active{background:var(--accent-soft)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink)}
  .circle{width:9px;height:9px;border-radius:50%;border:1.6px solid var(--ink)}
  .dash{width:11px;height:2px;border-radius:2px;background:var(--ink)}
  .ddash{display:flex;flex-direction:column;gap:2.6px}
  .ddash i{display:block;width:11px;height:1.8px;border-radius:2px;background:var(--ink)}
  .glyph{font-size:14px;line-height:1}
  .glyph.done{color:var(--green);font-weight:700}
  .glyph.migrated{color:var(--ink-faint);font-weight:700;font-size:15px}
  .glyph.dropped{color:var(--red);opacity:.75;font-weight:600}
  .glyph.delegated{color:var(--badge-ink);font-weight:700}
  .entry-body{flex:1;min-width:0}
  .entry-text{font-size:16px;line-height:1.6;word-break:break-all}
  .line-input{
    width:100%;border:none;outline:none;background:none;font-family:inherit;
    font-size:16px;line-height:1.6;color:var(--ink);padding:0;caret-color:var(--accent);
    resize:none;overflow:hidden;display:block;word-break:break-all;
  }
  .entry.done .entry-text,.entry.done .line-input{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:rgba(95,143,102,.5)}
  .entry.migrated .entry-text,.entry.delegated .entry-text{color:var(--ink-soft)}
  .entry.dropped .entry-text{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:rgba(192,96,78,.45)}
  .entry.mood .entry-text,.entry.mood .line-input{color:#7A6A8F}
  .entry.note .entry-text,.entry.note .line-input{color:var(--ink-soft)}
  .chips{margin-top:3px}
  .badge{
    display:inline-block;font-size:11.5px;background:var(--badge-bg);color:var(--badge-ink);
    padding:2px 9px;border-radius:999px;margin-right:6px;
  }
  .badge.acc{background:var(--accent-soft);color:var(--accent)}
  .children{margin-left:34px;border-left:2px solid var(--line);padding-left:14px}
  .rowtools{flex:none;display:flex;align-items:center;gap:2px}
  .kidpill{
    font-size:11px;color:var(--badge-ink);background:var(--badge-bg);border:none;border-radius:999px;
    padding:4px 9px;cursor:pointer;font-family:inherit;
  }
  .addchild{
    width:30px;height:30px;border:none;background:none;color:var(--ink-faint);
    font-size:19px;line-height:1;cursor:pointer;border-radius:9px;
  }
  .addchild:active{background:var(--accent-soft);color:var(--accent)}
  @keyframes flashbg{0%{background:var(--accent-soft)}100%{background:transparent}}
  .flash{animation:flashbg 1.6s;border-radius:12px}
  .daynav{width:26px;height:30px;border:none;background:none;color:var(--ink-faint);font-size:19px;cursor:pointer;border-radius:8px;flex:none;padding:0}
  .daynav:active{background:var(--accent-soft);color:var(--accent)}
  .children .entry{padding:6px 0}
  .tapzone{color:var(--ink-faint);font-size:14px;cursor:text;padding:9px 2px}
  .tapzone.big{min-height:150px;padding-top:14px;display:flex;align-items:flex-start;gap:10px;font-size:15px}
  .penicon{width:20px;height:20px;flex:none;color:var(--accent);margin-top:-1px}
  .empty-hint{font-size:14px;color:var(--ink-faint);padding:14px 2px;line-height:1.7}
  .readonly-tip{
    font-size:12px;color:var(--ink-faint);background:var(--badge-bg);
    border-radius:10px;padding:8px 12px;margin-top:18px;display:inline-block;
  }
  /* ---------- 编辑工具条 ---------- */
  #toolbar{
    position:absolute;left:0;right:0;bottom:0;display:none;align-items:center;gap:6px;overflow-x:auto;
    padding:9px 14px calc(12px + env(safe-area-inset-bottom));
    background:rgba(255,253,246,.96);border-top:1px solid var(--line);z-index:6;
  }
  #toolbar.on{display:flex}
  #tagSug{
    position:absolute;left:0;right:0;display:none;gap:8px;align-items:center;
    padding:8px 14px;background:rgba(250,246,236,.97);border-top:1px solid var(--line);
    z-index:6;overflow-x:auto;
  }
  #tagSug.on{display:flex}
  #tagSug .gs-chip{flex:none}
  .ts-label{font-size:12px;color:var(--ink-faint);flex:none}
  .tb-btn{
    flex:none;min-width:36px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--bg);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--ink);
    font-family:inherit;padding:0 8px;white-space:nowrap;
  }
  .tb-btn:active{background:var(--accent-soft)}
  .tb-btn.warn{color:var(--red)}
  .tb-sep{width:1px;height:20px;background:var(--line)}
  .tb-hint{margin-left:auto;font-size:11px;color:var(--ink-faint)}
  /* ---------- 总日历 ---------- */
  .cal-head{display:flex;align-items:center;margin-top:18px}
  .cal-title{flex:1;text-align:center;font-size:16px;font-weight:700}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px}
  .cal-wd{text-align:center;font-size:11px;color:var(--ink-faint);padding:8px 0 4px}
  .cal-day{
    height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;border-radius:12px;cursor:pointer;font-size:14px;
  }
  .cal-day:active{background:var(--accent-soft)}
  .cal-day .num{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .cal-day.today .num{border:1.6px solid var(--accent);color:var(--accent);font-weight:700}
  .dots{display:flex;gap:3px;height:6px;align-items:center}
  .dots i{width:4.5px;height:4.5px;border-radius:50%;background:var(--ink)}
  .dots i.fut{background:none;border:1.4px solid var(--accent);width:4px;height:4px}
  .cal-legend{display:flex;gap:18px;justify-content:center;margin-top:16px;font-size:12px;color:var(--ink-soft);align-items:center}
  .cal-legend i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink);margin-right:5px;vertical-align:1px}
  .cal-legend i.fut{background:none;border:1.4px solid var(--accent)}
  /* ---------- 抽屉 ---------- */
  #mask{position:absolute;inset:0;background:rgba(40,36,28,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
  #mask.on{opacity:1;pointer-events:auto}
  #drawer{
    position:absolute;top:0;bottom:0;left:0;width:78%;max-width:300px;background:#FBF6EB;z-index:9;
    transform:translateX(-105%);transition:transform .28s cubic-bezier(.22,.9,.36,1);
    display:flex;flex-direction:column;box-shadow:8px 0 30px rgba(0,0,0,.08);
  }
  #drawer.on{transform:translateX(0)}
  .drawer-head{padding:calc(20px + env(safe-area-inset-top)) 22px 10px}
  .drawer-title{font-size:20px;font-weight:700;letter-spacing:1px}
  .drawer-sub{font-size:12px;color:var(--ink-soft);margin-top:4px}
  .drawer-scroll{flex:1;overflow-y:auto;padding:0 12px 24px;scrollbar-width:none}
  .drawer-label{font-size:11px;color:var(--ink-faint);letter-spacing:2px;margin:16px 10px 6px}
  .d-item{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:12px;cursor:pointer;font-size:15px}
  .d-item:active{background:var(--accent-soft)}
  .d-item .sym{margin:0;cursor:inherit}
  .d-item .count{margin-left:auto;font-size:12px;color:var(--ink-faint)}
  .d-item.plain{font-weight:500}
  .d-item .d-ico{width:22px;text-align:center;font-size:15px}
  .search-input{
    width:100%;margin-top:12px;border:1px solid var(--line);background:var(--card);border-radius:10px;
    padding:8px 12px;font-size:16px;font-family:inherit;outline:none;color:var(--ink);
  }
  .search-input::placeholder{color:var(--ink-faint)}
  #gsheet{
    position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,.12);padding:18px 20px calc(20px + env(safe-area-inset-bottom));
    z-index:11;display:none;
  }
  #gsheet.on{display:block}
  .gs-title{font-size:15px;font-weight:700;margin-bottom:12px}
  .gs-chips{display:flex;flex-wrap:wrap;gap:8px}
  .gs-chip{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-family:inherit;color:var(--ink)}
  .gs-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .gs-new{display:flex;gap:8px;margin-top:14px}
  .gs-new input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-family:inherit;font-size:16px;background:var(--bg);outline:none;color:var(--ink)}
  .gs-new button{border:none;background:var(--ink);color:#fff;border-radius:10px;padding:0 14px;font-family:inherit;cursor:pointer;font-size:13px}
  .gs-done{margin-top:14px;width:100%;border:none;background:var(--accent);color:#fff;border-radius:12px;padding:11px;font-family:inherit;font-size:14px;cursor:pointer}
  #report{position:absolute;inset:0;background:var(--bg);z-index:13;display:none;flex-direction:column}
  #report.on{display:flex}
  .rp-body{flex:1;overflow-y:auto;padding:16px 20px}
  .rp-tabs{display:flex;gap:8px;margin:2px 0 14px}
  .rp-text{white-space:pre-wrap;font-size:14px;line-height:1.85;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .rp-note{font-size:12px;color:var(--ink-faint);margin-top:12px}
  .chip{
    font-size:13.5px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);cursor:pointer;color:var(--ink-soft);font-family:inherit;
  }
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .thumbs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
  #lightbox{position:absolute;inset:0;background:rgba(30,28,22,.92);z-index:15;display:none;align-items:center;justify-content:center;cursor:zoom-out}
  #lightbox.on{display:flex}
  #lightbox img{max-width:92%;max-height:86%;border-radius:12px}
  #qsheet{
    position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,.12);padding:18px 20px calc(20px + env(safe-area-inset-bottom));
    z-index:11;display:none;
  }
  #qsheet.on{display:block}
  .set-row{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
  .set-row .sub{margin-left:auto;font-size:12px;color:var(--ink-faint);text-align:right}
  .switch{margin-left:auto;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:none;cursor:pointer}
  .switch.on{background:var(--green)}
  .switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch.on i{left:21px}
  .gm-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .gm-name{font-size:14.5px;flex:1;display:flex;align-items:center;gap:8px}
  .gm-name .gdot{width:10px;height:10px;border-radius:50%;flex:none}
  .gm-name input{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:inherit;font-size:13.5px;background:var(--bg);outline:none;color:var(--ink)}
  .gm-btn{font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-family:inherit;color:var(--ink-soft);flex:none}
  .gm-btn.danger{color:var(--red)}
  .gm-inline{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 10px;
    font-family:inherit;font-size:16px;background:var(--bg);outline:none;color:var(--ink);
  }
  .mig-quick{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .qdate{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;
    font-family:inherit;font-size:16px;background:var(--bg);color:var(--ink);outline:none;
  }
  .cdots{display:flex;gap:10px;flex-wrap:wrap;padding:4px 0;align-items:center}
  .cdot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;flex:none}
  .cdot.on{border-color:var(--ink)}
  .mood-strip{display:flex;gap:3px;margin:12px 0 2px;flex-wrap:wrap}
  .mood-cell{width:17px;height:17px;border-radius:5px;background:var(--badge-bg)}
  .mood-cell.has{background:#EAE7F5;position:relative}
  .mood-cell.has::after{content:'';position:absolute;inset:0;margin:auto;width:6px;height:6px;border-radius:50%;background:#7A6A8F}
  .drawer-line{height:1px;background:var(--line);margin:14px 10px}
  /* ---------- 复盘 ---------- */
  #review{position:absolute;inset:0;background:var(--bg);z-index:12;display:none;flex-direction:column}
  #review.on{display:flex}
  .rv-head{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line)}
  .rv-title{flex:1;font-size:17px;font-weight:700}
  .rv-prog{font-size:12px;color:var(--ink-soft)}
  .rv-body{flex:1;overflow-y:auto;padding:20px 20px 160px;display:flex;flex-direction:column}
  .rv-done-note{font-size:13px;color:var(--green);background:#EDF3EE;border-radius:12px;padding:10px 14px;margin-bottom:18px}
  .rv-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:0 8px 28px rgba(51,49,43,.07)}
  .rv-task{font-size:18px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
  .rv-meta{margin-top:8px}
  .rv-q{font-size:13px;color:var(--ink-soft);margin:18px 0 12px}
  .rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rv-btn{
    border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 8px;
    font-size:15px;cursor:pointer;font-family:inherit;color:var(--ink);
    display:flex;align-items:center;justify-content:center;gap:7px;font-weight:500;
  }
  .rv-btn:active{background:var(--accent-soft)}
  .rv-btn .g{font-weight:700}
  .rv-btn.b-done .g{color:var(--green)}
  .rv-btn.b-mig .g{color:var(--accent)}
  .rv-btn.b-drop .g{color:var(--red)}
  .rv-btn.b-del .g{color:var(--badge-ink)}
  .rv-mig-panel{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px}
  .rv-mig-panel.on{display:block}
  .rv-mig-row{font-size:13px;color:var(--ink-soft);margin-bottom:8px;display:flex;justify-content:space-between}
  #migRange,#qRange{width:100%;accent-color:var(--accent)}
  #migNote,#qNote{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px;
    font-family:inherit;margin-top:12px;background:var(--bg);outline:none;color:var(--ink);
  }
  .rv-confirm{margin-top:14px;width:100%;border:none;background:var(--ink);color:#fff;border-radius:12px;padding:12px;font-size:15px;cursor:pointer;font-family:inherit}
  .rv-finish{margin:auto;text-align:center;color:var(--ink-soft);font-size:15.5px;line-height:2}
  .rv-finish b{font-size:18px;color:var(--ink)}
  #toast{
    position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
    background:rgba(31,28,23,.93);color:#F6EFE3;font-size:13.5px;padding:9px 18px;border-radius:999px;
    opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap;
  }
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="phone">
  <header>
    <button class="icon-btn" id="menuBtn" aria-label="菜单"><span class="hamburger"><i></i><i></i><i></i></span></button>
    <button class="daynav" id="prevDay">‹</button>
    <div id="topTitle" style="text-align:center">今天</div>
    <button class="daynav" id="nextDay">›</button>
    <button class="pill-btn" id="reviewBtn">复盘</button>
  </header>
  <main id="view"></main>
  <div id="tagSug"></div>
  <div id="toolbar"></div>
  <div id="mask"></div>
  <aside id="drawer">
    <div class="drawer-head">
      <div class="drawer-title" style="display:flex;align-items:center;gap:9px"><span id="drawerDot" style="display:flex"></span><span>点点手帐 <span style="color:var(--accent)">Dot</span></span></div>
      <div class="drawer-sub" id="drawerSub"></div>
      <input id="searchBox" class="search-input" placeholder="搜索，或输入 #分组名" autocomplete="off">
    </div>
    <div class="drawer-scroll" id="drawerList"></div>
  </aside>
  <div id="review"></div>
  <div id="gsheet"></div>
  <div id="qsheet"></div>
  <div id="report"></div>
  <div id="lightbox"></div>
  <input type="file" id="imgInput" accept="image/*" multiple style="display:none">
<input type="file" id="mdInput" accept=".md,.markdown,.txt" style="display:none">
<input type="file" id="jsonInput" accept=".json,application/json" style="display:none">
  <div id="toast"></div>
</div>
<script>
/* ============ 数据与本地存储 ============ */
let uid = 0;
/* ---- 日期 ---- */
function dkey(d){ return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate(); }
function parseKey(k){ const a = k.split('.').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
function effNow(){ const n = new Date(); if (n.getHours() < 4) n.setDate(n.getDate() - 1); return n; }
const TODAY = dkey(effNow());
function addDaysK(k, n){ const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); }
const TOMORROW = addDaysK(TODAY, 1);
function fmtKey(k){ const a = k.split('.'); return a[1] + '月' + a[2] + '日'; }
function fmtShort(k){ const a = k.split('.'); return a[1] + '.' + a[2]; }
function weekCN(k){ return '周' + '日一二三四五六'[parseKey(k).getDay()]; }
function dayGroupTitle(k){ return fmtKey(k) + ' · ' + weekCN(k); }
function key2iso(k){ const a = k.split('.').map(Number); return a[0] + '-' + String(a[1]).padStart(2, '0') + '-' + String(a[2]).padStart(2, '0'); }
function iso2key(s){ const a = s.split('-').map(Number); return a[0] + '.' + a[1] + '.' + a[2]; }
function nextMondayKey(){ const d = parseKey(TODAY); d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7)); return dkey(d); }
const WKMAP = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0};
function upcomingWeekday(w){
  const d = parseKey(TODAY); let diff = (w - d.getDay() + 7) % 7; if (!diff) diff = 7;
  d.setDate(d.getDate() + diff); return dkey(d);
}
function nextWeekWeekday(w){
  const d = parseKey(TODAY);
  const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 7);
  mon.setDate(mon.getDate() + ((w + 6) % 7)); return dkey(mon);
}
/* ---- 本地存储 ---- */
const LSKEY = 'bujo_local_v1';
let PAGES = {}, SEEN = {}, GCOLOR = {};
let extraGroups = ['工作', '健康', '恋爱'];
const SET = {recog:true, accent:0};
try{
  const raw = localStorage.getItem(LSKEY);
  if (raw){ const s = JSON.parse(raw);
    PAGES = s.pages || {}; extraGroups = s.extraGroups || extraGroups;
    Object.assign(SET, s.set || {}); SEEN = s.seen || {}; GCOLOR = s.gcolor || {}; }
}catch(_){}
let saveTm = null;
function scheduleSave(){
  clearTimeout(saveTm);
  saveTm = setTimeout(() => {
    try{ localStorage.setItem(LSKEY, JSON.stringify({pages:PAGES, extraGroups, set:SET, seen:SEEN, gcolor:GCOLOR})); }
    catch(_){ toast('存储已满：请删除一些图片，或先导出备份'); }
    try{ ghSchedule(); }catch(_){}
  }, 300);
}
const P = () => PAGES[TODAY];

/* ============ 基础工具 ============ */
const $ = s => document.querySelector(s);
const escAttr = s => String(s || '').replace(/"/g, '&quot;');
const view = $('#view'), topTitle = $('#topTitle'), reviewBtn = $('#reviewBtn'), toolbar = $('#toolbar');
let cur = {name:'today'};
let focusRef = null, pendingDel = null;
let undoStack = [];
function snapshot(label){
  undoStack.push({label, data: JSON.parse(JSON.stringify(PAGES[TODAY]))});
  if (undoStack.length > 20) undoStack.shift();
}
function placeToolbar(){
  const vv = window.visualViewport;
  const kb = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
  toolbar.style.bottom = kb + 'px';
  const S = $('#tagSug');
  if (S) S.style.bottom = (kb + (toolbar.classList.contains('on') ? (toolbar.offsetHeight || 54) : 0)) + 'px';
  view.style.paddingBottom = (150 + kb) + 'px';
  ['gsheet', 'qsheet'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.bottom = (el.classList.contains('on') ? kb : 0) + 'px';
  });
}
function findScroller(el){
  let sc = el.parentElement;
  while (sc && sc !== document.body){
    const cs = getComputedStyle(sc);
    if (sc.scrollHeight > sc.clientHeight + 4 && /(auto|scroll)/.test(cs.overflowY)) return sc;
    sc = sc.parentElement;
  }
  return null;
}
function keepAboveKeyboard(el){
  if (!el || !el.getBoundingClientRect || !el.isConnected) return;
  const vv = window.visualViewport;
  const vBottom = vv ? (vv.offsetTop + vv.height) : window.innerHeight;
  const isLine = el.classList && el.classList.contains('line-input');
  const tbH = (isLine && toolbar.classList.contains('on')) ? (toolbar.offsetHeight || 54) : 0;
  const sugH = (isLine && $('#tagSug').classList.contains('on')) ? ($('#tagSug').offsetHeight || 44) : 0;
  const limit = vBottom - tbH - sugH - 14;
  const r = el.getBoundingClientRect();
  const sc = findScroller(el);
  if (!sc) return;
  if (r.bottom > limit) sc.scrollTop += (r.bottom - limit);
  else if (r.top < 70) sc.scrollTop -= (70 - r.top);
}
function scrollFocused(){
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) keepAboveKeyboard(ae);
}
function updateToolbarVis(){
  const ae = document.activeElement;
  const editing = (cur.name === 'today' || cur.name === 'history' || cur.name === 'day') && ae && ae.classList && ae.classList.contains('line-input');
  toolbar.classList.toggle('on', editing);
  if (!editing) $('#tagSug').classList.remove('on');
  placeToolbar();
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')){
    setTimeout(scrollFocused, 120); setTimeout(scrollFocused, 420);
  }
}
setInterval(placeToolbar, 300);

/* ============ # 联想（输入 # 弹出分组建议） ============ */
let sugTarget = null;
function updateTagSug(e, inp){
  const S = $('#tagSug');
  const m = inp.value.match(/#([^\s#，。,]*)$/);
  if (!m){ S.classList.remove('on'); return; }
  const part = m[1];
  sugTarget = {e, inp};
  S.innerHTML = '<span class="ts-label">归入分组</span>';
  const names = allGroupNames().filter(g => !part || g.includes(part));
  const addChip = (label, fn) => {
    const c = document.createElement('button'); c.className = 'gs-chip'; c.textContent = label;
    c.addEventListener('click', fn); S.appendChild(c);
  };
  names.forEach(g => addChip('#' + g, () => applyTag(g)));
  if (part && !allGroupNames().includes(part))
    addChip('新建 #' + part, () => { if (!extraGroups.includes(part)) extraGroups.push(part); applyTag(part); });
  S.classList.add('on'); placeToolbar();
}
function applyTag(g){
  if (!sugTarget) return;
  const {e, inp} = sugTarget;
  e.text = inp.value.replace(/#([^\s#，。,]*)$/, '').trim();
  if (!(e.groups = e.groups || []).includes(g)) e.groups.push(g);
  $('#tagSug').classList.remove('on');
  toast('已归入 #' + g);
  render();
}
document.addEventListener('DOMContentLoaded', () => {});
$('#tagSug').addEventListener('pointerdown', ev => ev.preventDefault());
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', updateToolbarVis);
  window.visualViewport.addEventListener('scroll', placeToolbar);
}
window.addEventListener('scroll', () => { if (window.scrollY) window.scrollTo(0, 0); });

/* ============ 翻天：顶栏箭头 + 左右滑 ============ */
function curDayKey(){
  return cur.name === 'today' ? TODAY : cur.name === 'history' ? cur.date : cur.name === 'day' ? cur.key : null;
}
function navDay(d){
  const k0 = curDayKey(); if (!k0) return;
  gotoDay(addDaysK(k0, d));
}
document.getElementById('prevDay').onclick = () => navDay(-1);
document.getElementById('nextDay').onclick = () => navDay(1);
let swX = null, swY = null;
view.addEventListener('pointerdown', ev => { swX = ev.clientX; swY = ev.clientY; });
view.addEventListener('pointerup', ev => {
  if (swX === null) return;
  const dx = ev.clientX - swX, dy = ev.clientY - swY, sx = swX;
  swX = null;
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  if (sx < 24) return;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 40 && curDayKey()) navDay(dx > 0 ? -1 : 1);
});
document.addEventListener('focusin', updateToolbarVis);
document.addEventListener('focusout', () => setTimeout(updateToolbarVis, 80));

/* ============ 分组 ============ */
let sheetTarget = null;
const GPAL = [
  ['#E8EFE4','#5F7E64'],['#EAE7F5','#6C5F8F'],['#F5E8E0','#9A6B4F'],['#E4EDF3','#4F7286'],
  ['#F6E4EA','#B25A76'],['#FBF2D5','#93762A'],['#E0F0ED','#3F8578'],['#ECECEC','#6B6B6B'],
];
function gStyle(name){
  if (GCOLOR[name] != null && GPAL[GCOLOR[name]]) return GPAL[GCOLOR[name]];
  let h = 0; for (const c of name) h += c.charCodeAt(0); return GPAL[h % 4];
}
const ACCENTS = [['#F45D08','#FBE7D4'],['#C97B4A','#F6EADF'],['#5F8F66','#E8F0E9'],['#4E7A9B','#E3EDF4'],['#8A6FB1','#ECE7F4'],['#C2607A','#F6E4EA']];
function applyAccent(){
  const a = ACCENTS[SET.accent] || ACCENTS[0];
  const r = document.documentElement.style;
  r.setProperty('--accent', a[0]); r.setProperty('--accent-soft', a[1]);
}
function allGroupNames(){
  const s = new Set(extraGroups);
  walk((d, e) => { if (e.groups) e.groups.forEach(g => s.add(g)); });
  return [...s];
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('on'), 1700);
}
function walkPage(date, cb){
  const rec = list => list.forEach(e => { cb(e); if (e.children) rec(e.children); });
  rec(PAGES[date].plan); rec(PAGES[date].flow);
}
function walk(cb){ Object.keys(PAGES).sort((a, b) => parseKey(b) - parseKey(a)).forEach(d => walkPage(d, e => cb(d, e))); }
function walkWithParent(cb){
  Object.keys(PAGES).sort((a, b) => parseKey(b) - parseKey(a)).forEach(k => {
    const rec = (list, parent) => list.forEach(e => { cb(k, e, parent); if (e.children) rec(e.children, e); });
    rec(PAGES[k].plan, null); rec(PAGES[k].flow, null);
  });
}
function editKey(){ return cur.name === 'history' ? cur.date : cur.name === 'day' ? cur.key : TODAY; }
function EP(){
  const k = editKey();
  if (!PAGES[k]) PAGES[k] = {plan:[], flow:[]};
  return PAGES[k];
}
function findEntry(e){
  const search = (list, parent) => {
    for (let i = 0; i < list.length; i++){
      if (list[i] === e) return {list, idx:i, parent};
      if (list[i].children){ const r = search(list[i].children, list[i]); if (r) return r; }
    }
    return null;
  };
  return search(EP().plan, null) || search(EP().flow, null);
}
function removeEntry(e){ const loc = findEntry(e); if (loc) loc.list.splice(loc.idx, 1); }

/* ============ 符号 ============ */
function symNode(e){
  const s = document.createElement('span'); s.className = 'sym';
  const st = e.state;
  if (e.sym === 'task'){
    if (st === 'done')      s.innerHTML = '<span class="glyph done">✓</span>';
    else if (st === 'migrated')  s.innerHTML = '<span class="glyph migrated">›</span>';
    else if (st === 'dropped')   s.innerHTML = '<span class="glyph dropped">✕</span>';
    else if (st === 'delegated') s.innerHTML = '<span class="glyph delegated">→</span>';
    else s.innerHTML = '<span class="dot"></span>';
  }
  else if (e.sym === 'event') s.innerHTML = '<span class="circle"></span>';
  else if (e.sym === 'note')  s.innerHTML = '<span class="dash"></span>';
  else if (e.sym === 'mood')  s.innerHTML = '<span class="ddash"><i></i><i></i></span>';
  return s;
}

/* ============ 逐行智能识别 ============ */
function commit(e){
  let t = (e.text || '').trim(); let changed = false;
  const gm = t.match(/#([^\s#，。,]{1,12})/g);
  if (gm){
    e.groups = e.groups || [];
    gm.forEach(x => { const g = x.slice(1);
      if (!e.groups.includes(g)){ e.groups.push(g); toast('已归入 #' + g); } });
    t = t.replace(/#[^\s#，。,]{1,12}\s?/g, '').trim();
    e.text = t; changed = true;
  }
  const tm = t.match(/([01]?\d|2[0-3])[:：][0-5]\d/);
  if (tm){ const v = tm[0].replace('：', ':'); if (e.time !== v){ e.time = v; changed = true; } }
  else if (!e.time){
    const cm = t.match(/(上午|早上|中午|下午|晚上)([一二三四五六七八九十两\d]{1,3})点(半|一刻|三刻|(\d{1,2})分)?/);
    if (cm){
      const M = {'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12};
      let h = /^\d+$/.test(cm[2]) ? +cm[2] : M[cm[2]];
      if (h != null && h <= 23){
        if ((cm[1] === '下午' || cm[1] === '晚上') && h < 12) h += 12;
        if (cm[1] === '中午' && h <= 2) h += 12;
        const mi = cm[3] === '半' ? 30 : cm[3] === '一刻' ? 15 : cm[3] === '三刻' ? 45 : (cm[4] ? +cm[4] : 0);
        e.time = String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0');
        changed = true; toast('已识别时间 ' + e.time);
      }
    }
  }
  const dm = t.match(/(\d{1,2})\.(\d{1,2})号?/);
  if (dm){
    const ty = parseKey(TODAY).getFullYear();
    let key = ty + '.' + (+dm[1]) + '.' + (+dm[2]);
    if (parseKey(key) < parseKey(TODAY)) key = (ty + 1) + '.' + (+dm[1]) + '.' + (+dm[2]);
    if (e.due !== key){ e.due = key; changed = true; toast('已同步到 ' + fmtKey(key)); } }
  else if (!e.due){
    let rel = null, mr = null;
    if (/大后天/.test(t)) rel = addDaysK(TODAY, 3);
    else if (/后天/.test(t)) rel = addDaysK(TODAY, 2);
    else if (/明天/.test(t)) rel = TOMORROW;
    else if ((mr = t.match(/下+周([一二三四五六日天])/))) rel = nextWeekWeekday(WKMAP[mr[1]]);
    else if (!/上周/.test(t) && (mr = t.match(/(?:这周|本周|周)([一二三四五六日天])/))) rel = upcomingWeekday(WKMAP[mr[1]]);
    else if ((mr = t.match(/下个?月(\d{1,2})[号日]/))){
      const d = parseKey(TODAY); d.setDate(1); d.setMonth(d.getMonth() + 1); d.setDate(+mr[1]); rel = dkey(d);
    }
    else if (/下个?月/.test(t)){
      const d = parseKey(TODAY); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1);
      const mx = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      d.setDate(Math.min(day, mx)); rel = dkey(d);
    }
    else if ((mr = t.match(/(\d{1,2})月(\d{1,2})[号日]/))){
      const ty = parseKey(TODAY).getFullYear();
      let k = ty + '.' + (+mr[1]) + '.' + (+mr[2]);
      if (parseKey(k) < parseKey(TODAY)) k = (ty + 1) + '.' + (+mr[1]) + '.' + (+mr[2]);
      rel = k;
    }
    if (rel){ e.due = rel; changed = true; toast('已同步到 ' + fmtKey(rel) + '（' + weekCN(rel) + '）'); }
  }
  if (SET.recog && !e.userSet && t){
    let g = null;
    if (/^(见了|去了|开完|参加了|聊了|吃了|逛了|看了|开了)/.test(t)) g = 'event';
    else if (t.length <= 10 && /(焦虑|开心|难过|平静|烦|累|期待|紧张|兴奋|低落|郁闷|委屈|爽)/.test(t)) g = 'mood';
    if (g){
      delete e.defSym;
      if (e.sym !== g){
        e.sym = g; e.state = undefined; changed = true;
        toast('识别为' + (g === 'event' ? '事件 ○' : '心情 =') + ' · 可在工具条改');
      }
    }
  }
  if (e.defSym && e.sym === 'event' && e.due){
    e.sym = 'task'; e.state = 'open'; delete e.defSym; changed = true;
  }
  return changed;
}

/* ============ 条目渲染 ============ */
function chipRow(e, editable){
  const hasG = e.groups && e.groups.length;
  if (!e.badge && !e.time && !e.due && !hasG && !e.src && !e.srcDay && !e.note) return null;
  const c = document.createElement('div'); c.className = 'chips';
  if (hasG) e.groups.forEach(g => {
    const b = document.createElement('span'); b.className = 'badge';
    const [bg, fg] = gStyle(g); b.style.background = bg; b.style.color = fg;
    b.textContent = '#' + g; c.appendChild(b);
  });
  if (e.badge){ const b = document.createElement('span'); b.className = 'badge'; b.textContent = e.badge; c.appendChild(b); }
  if (e.srcDay){
    const b = document.createElement('span'); b.className = 'badge acc';
    b.textContent = '◂ ' + fmtShort(e.srcDay) + ' 转来';
    b.style.cursor = 'pointer';
    b.onclick = ev => { ev.stopPropagation(); jumpToEntry(e.srcDay, e.srcId); };
    c.appendChild(b);
  } else if (e.src){
    const b = document.createElement('span'); b.className = 'badge';
    b.textContent = '◂ ' + String(e.src).slice(0, 12); c.appendChild(b);
  }
  if (e.note){
    const b = document.createElement('span'); b.className = 'badge';
    b.textContent = '✎ ' + String(e.note).slice(0, 14); c.appendChild(b);
  }
  if (e.time){
    const b = document.createElement('span'); b.className = 'badge'; b.textContent = '⏰ ' + e.time;
    if (editable){ b.style.cursor = 'pointer'; b.onclick = ev => { ev.stopPropagation(); openTimeSheet(e); }; }
    c.appendChild(b);
  }
  if (e.due){
    const b = document.createElement('span'); b.className = 'badge acc'; b.textContent = '→' + fmtShort(e.due);
    b.style.cursor = 'pointer';
    if (editable){ b.onclick = ev => { ev.stopPropagation(); openDueSheet(e); }; }
    else { b.onclick = ev => { ev.stopPropagation(); gotoDay(e.due); }; }
    c.appendChild(b);
  }
  return c;
}
function growTA(t){ if (!t || !t.isConnected) return; t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
function entryNode(e, editable, isChild, flat, liveSym){
  e._id = e._id || (++uid);
  const wrap = document.createElement('div');
  wrap.dataset.eid = e._id;
  const row = document.createElement('div');
  row.className = 'entry ' + e.sym + ' ' + (e.state || '');
  const s = symNode(e);
  if ((editable || liveSym) && e.sym === 'task'){
    let lpTimer = null, lpFired = false;
    s.addEventListener('pointerdown', () => {
      lpFired = false;
      lpTimer = setTimeout(() => { lpFired = true; qsTarget = e; openQSheet(); }, 450);
    });
    s.addEventListener('pointerup', () => clearTimeout(lpTimer));
    s.addEventListener('pointerleave', () => clearTimeout(lpTimer));
    s.addEventListener('click', () => {
      if (lpFired){ lpFired = false; return; }
      if (e.state === 'open'){
        snapshot('处理任务');
        e.state = 'done'; render();
        askMemo(e);
      } else if (e.state === 'done'){
        e.state = 'open'; toast('恢复待办'); render();
      } else { qsTarget = e; openQSheet(); }
    });
    s.title = '点按完成 · 长按处理';
  } else s.classList.add('static');
  const body = document.createElement('div'); body.className = 'entry-body';
  if (editable){
    const inp = document.createElement('textarea');
    inp.className = 'line-input'; inp.rows = 1; inp.value = e.text; inp.dataset.eid = e._id;
    inp.setAttribute('autocomplete', 'off');
    requestAnimationFrame(() => growTA(inp));
    inp.addEventListener('input', () => { e.text = inp.value; growTA(inp); updateTagSug(e, inp); keepAboveKeyboard(inp); });
    inp.addEventListener('focus', () => { focusRef = e; pendingDel = null; });
    inp.addEventListener('keydown', ev => {
      if (ev.isComposing) return;
      if (ev.key === 'Enter'){
        ev.preventDefault(); $('#tagSug').classList.remove('on'); commit(e);
        const loc = findEntry(e); if (!loc) return;
        if (!e.text.trim()){
          if (loc.parent){
            loc.list.splice(loc.idx, 1);
            const ploc = findEntry(loc.parent);
            const pe = Object.assign({text:'', _id:++uid}, defFor(ploc.list));
            ploc.list.splice(ploc.idx + 1, 0, pe);
            focusRef = pe; render();
          }
          return;
        }
        let ne;
        if (!loc.parent && e.sym === 'event'){
          ne = {sym:'task', state:'open', text:'', _id:++uid};
          (e.children = e.children || []).push(ne); e.collapsed = false;
        } else if (loc.parent){
          ne = {sym:'task', state:'open', text:'', _id:++uid};
          loc.list.splice(loc.idx + 1, 0, ne);
        } else {
          ne = Object.assign({text:'', _id:++uid}, defFor(loc.list));
          loc.list.splice(loc.idx + 1, 0, ne);
        }
        focusRef = ne; render();
      }
      if (ev.key === 'Backspace' && !inp.value){
        ev.preventDefault();
        if (e.images && e.images.length){
          snapshot('删除图片'); e.images.pop();
          toast('已删除 1 张图片 · 可撤回'); render(); return;
        }
        snapshot('删除行'); removeEntry(e);
        if (focusRef === e) focusRef = null; render();
      }
    });
    inp.addEventListener('blur', () => {
      setTimeout(() => {
        if (!inp.isConnected) return;
        const changed = commit(e);
        const keep = (e.images && e.images.length) || (e.children && e.children.length) || e._imgPending
          || (sheetTarget === e && $('#gsheet').classList.contains('on'));
        if (!e.text.trim() && !keep){ removeEntry(e); if (focusRef === e) focusRef = null; render(); return; }
        if (changed) render();
      }, 60);
    });
    body.appendChild(inp);
  } else {
    const tx = document.createElement('div'); tx.className = 'entry-text'; tx.textContent = e.text;
    body.appendChild(tx);
  }
  const chips = chipRow(e, editable); if (chips) body.appendChild(chips);
  if (e.images && e.images.length){
    const tw = document.createElement('div'); tw.className = 'thumbs';
    e.images.forEach((src, idx) => {
      const im = document.createElement('img'); im.src = src;
      im.onclick = ev => { ev.stopPropagation(); openLightbox(e, idx, editable); };
      tw.appendChild(im);
    });
    body.appendChild(tw);
  }
  row.appendChild(s); row.appendChild(body);
  if (!isChild){
    const hasKids = e.children && e.children.length;
    const rt = document.createElement('div'); rt.className = 'rowtools';
    if (hasKids){
      const kp = document.createElement('button'); kp.className = 'kidpill';
      kp.textContent = (e.collapsed ? '▸ ' : '▾ ') + e.children.length;
      kp.onclick = ev => { ev.stopPropagation(); e.collapsed = !e.collapsed; render(); };
      rt.appendChild(kp);
    }
    if (editable && e.sym === 'event'){
      const ab = document.createElement('button'); ab.className = 'addchild'; ab.textContent = '＋';
      ab.title = '在这件事下记一笔';
      ab.onclick = ev => { ev.stopPropagation();
        const ne = {sym:'task', state:'open', text:'', _id:++uid};
        (e.children = e.children || []).push(ne); e.collapsed = false;
        focusRef = ne; render(); };
      rt.appendChild(ab);
    }
    if (rt.children.length) row.appendChild(rt);
  }
  wrap.appendChild(row);
  if (e.children && e.children.length && !e.collapsed && !flat){
    const c = document.createElement('div'); c.className = 'children';
    e.children.forEach(ch => c.appendChild(entryNode(ch, editable, true)));
    wrap.appendChild(c);
  }
  return wrap;
}
function gotoDay(k){
  if (k === TODAY) cur = {name:'today'};
  else if (parseKey(k) < parseKey(TODAY)){
    if (!PAGES[k]) PAGES[k] = {plan:[], flow:[]};
    cur = {name:'history', date:k};
  } else cur = {name:'day', key:k};
  render();
}
function jumpToEntry(date, id){
  gotoDay(date);
  setTimeout(() => {
    const el = view.querySelector('[data-eid="' + id + '"]');
    if (el){
      try{ el.scrollIntoView({block:'center'}); }catch(_){}
      el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1700);
    }
  }, 80);
}
function sectionLabel(t){ const d = document.createElement('div'); d.className = 'section-label'; d.textContent = t; return d; }
function jumpRow(date, e){
  const w = document.createElement('div');
  w.appendChild(entryNode(e, false, true, true, true));
  const tx = w.querySelector('.entry-text');
  if (tx){ tx.style.cursor = 'pointer'; tx.onclick = () => jumpToEntry(date, e._id); }
  return w;
}
function dateGroupList(box, filter){
  let n = 0, lastDate = null;
  walk((date, e) => {
    if (!filter(e)) return; n++;
    if (date !== lastDate){ lastDate = date;
      const g = document.createElement('div'); g.className = 'date-group';
      g.textContent = dayGroupTitle(date); box.appendChild(g); }
    box.appendChild(jumpRow(date, e));
  });
  return n;
}
function tapZone(text, big, onTap, pen){
  const z = document.createElement('div'); z.className = 'tapzone' + (big ? ' big' : '');
  if (pen){
    z.innerHTML = '<svg class="penicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>' + text + '</span>';
  } else z.textContent = text;
  z.addEventListener('click', onTap); return z;
}
function defFor(list){
  return (list === EP().flow) ? {sym:'event', defSym:true} : {sym:'task', state:'open'};
}
function addLine(list){
  const ne = Object.assign({text:'', _id:++uid}, defFor(list));
  list.push(ne); focusRef = ne; render();
  if (list === EP().plan){
    const n = EP().plan.filter(x => x.sym === 'task' && x.state === 'open').length;
    if (n >= 8) toast('已经第 ' + n + ' 件了——真的都是今天吗？');

}
function renderPageInto(box, date, editable){
  const p = PAGES[date];
  box.appendChild(sectionLabel('今天要做'));
  p.plan.forEach(e => box.appendChild(entryNode(e, editable)));
  if (editable) box.appendChild(tapZone('＋ 补一条要做的', false, () => addLine(p.plan)));

  p.flow.forEach(e => box.appendChild(entryNode(e, editable)));
  if (editable) box.appendChild(tapZone('点这里，记下今天发生的事…（○ 会接住它引发的一切）', true, () => addLine(p.flow), true));

  event:     {title:'○ 事件',   tip:'发生过的事',                 f:e => e.sym === 'event'},
  note:      {title:'— 笔记',   tip:'想法与备注',                 f:e => e.sym === 'note'},
  mood:      {title:'= 心情',   tip:'情绪轨迹',                   f:e => e.sym === 'mood'},
  done:      {title:'✓ 已完成', tip:'成就流水',                   f:e => e.state === 'done'},

/* ============ 总日历 ============ */
const WD_CN = ['日','一','二','三','四','五','六'];
function calMarks(y, m){
  const marks = {};
  Object.keys(PAGES).forEach(k => {
    const a = k.split('.').map(Number);
    if (a[0] !== y || a[1] !== m) return;
    let n = 0; walkPage(k, () => n++);
    if (n) marks[a[2]] = {rec:n, fut:false};
  });
  walk((d, e) => {
    if (!e.due || e.state === 'done' || e.state === 'dropped') return;
    const a = e.due.split('.').map(Number);
    if (a[0] === y && a[1] === m){ marks[a[2]] = marks[a[2]] || {rec:0}; marks[a[2]].fut = true; }
  });
  return marks;
}
function renderCal(){
  const y = cur.y, m = cur.m;
  const ta = TODAY.split('.').map(Number);
  const head = document.createElement('div'); head.className = 'cal-head';
  const prev = document.createElement('button'); prev.className = 'icon-btn'; prev.textContent = '‹';
  prev.onclick = () => { cur.m--; if (cur.m < 1){ cur.m = 12; cur.y--; } render(); };
  const next = document.createElement('button'); next.className = 'icon-btn'; next.textContent = '›';
  next.onclick = () => { cur.m++; if (cur.m > 12){ cur.m = 1; cur.y++; } render(); };
  const tt = document.createElement('div'); tt.className = 'cal-title'; tt.textContent = y + '年' + m + '月';
  head.appendChild(prev); head.appendChild(tt); head.appendChild(next); view.appendChild(head);
  const grid = document.createElement('div'); grid.className = 'cal-grid';
  ['一','二','三','四','五','六','日'].forEach(w => {
    const d = document.createElement('div'); d.className = 'cal-wd'; d.textContent = w; grid.appendChild(d);
  });
  const offset = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const days = new Date(y, m, 0).getDate();
  for (let i = 0; i < offset; i++) grid.appendChild(document.createElement('div'));
  const marks = calMarks(y, m);
  for (let d = 1; d <= days; d++){
    const cell = document.createElement('div'); cell.className = 'cal-day'; cell.dataset.day = d;
    if (y === ta[0] && m === ta[1] && d === ta[2]) cell.classList.add('today');
    const num = document.createElement('div'); num.className = 'num'; num.textContent = d; cell.appendChild(num);
    const dots = document.createElement('div'); dots.className = 'dots';
    const mk = marks[d];
    if (mk){
      const n = mk.rec >= 7 ? 3 : mk.rec >= 4 ? 2 : mk.rec >= 1 ? 1 : 0;
      for (let i = 0; i < n; i++) dots.appendChild(document.createElement('i'));
      if (mk.fut){ const f = document.createElement('i'); f.className = 'fut'; dots.appendChild(f); }
    }
    cell.appendChild(dots);
    cell.onclick = () => {
      const key = y + '.' + m + '.' + d;
      if (key === TODAY) cur = {name:'today'};
      else if (PAGES[key] && key !== TODAY) cur = {name:'history', date:key};
      else cur = {name:'day', key};
      render();
    };
    grid.appendChild(cell);
  }
  view.appendChild(grid);
  const lg = document.createElement('div'); lg.className = 'cal-legend';
  lg.innerHTML = '<span><i></i>有记录</span><span><i class="fut"></i>有安排</span><span>空白 = 断掉的日子</span>';
  view.appendChild(lg);
  const tip = document.createElement('div'); tip.className = 'readonly-tip';
  tip.textContent = '点过去的日子翻本 · 点未来的日子看预埋';
  tip.style.marginTop = '22px'; view.appendChild(tip);
}

    sw.onclick = ev => { ev.stopPropagation(); SET.recog = !SET.recog;

/* ============ 编辑工具条 ============ */
function buildToolbar(){
  toolbar.addEventListener('pointerdown', ev => ev.preventDefault());
  const mk = (html, fn, cls) => {
    const b = document.createElement('button'); b.className = 'tb-btn' + (cls ? ' ' + cls : '');
    if (typeof html === 'string') b.innerHTML = html; else b.appendChild(html);
    b.addEventListener('click', fn); toolbar.appendChild(b); return b;
  };
  const need = fn => () => { if (!focusRef){ toast('先点选一行'); return; } fn(focusRef); };
  [['task','待办'],['event','事件'],['note','笔记'],['mood','心情']].forEach(([sym]) => {
    const n = symNode({sym, state:'open'}); n.classList.add('static');
    mk(n, need(e => {
      snapshot('修改符号');
      e.sym = sym; e.userSet = true; delete e.defSym;
      if (sym === 'task'){ if (!e.state) e.state = 'open'; } else e.state = undefined;
      render();
    }));
  });
  mk('#', need(e => { sheetTarget = e; openSheet(); }));
  const sep1 = document.createElement('div'); sep1.className = 'tb-sep'; toolbar.appendChild(sep1);
  mk('⇥', need(e => {
    const loc = findEntry(e); if (!loc) return;
    if (loc.parent){ toast('已在子级，先 ⇤ 收回'); return; }
    if (loc.idx === 0){ toast('上面没有可挂载的条目'); return; }
    const prev = loc.list[loc.idx - 1];
    if (prev.sym !== 'event'){ toast('只能挂在事件（○）下面'); return; }
    snapshot('缩进');
    loc.list.splice(loc.idx, 1);
    (prev.children = prev.children || []).push(e);
    if ((!e.groups || !e.groups.length) && prev.groups && prev.groups.length) e.groups = [...prev.groups];
    toast('已挂到「' + (prev.text || '…') + '」下'); render();
  }), '');
  mk('⇤', need(e => {
    const loc = findEntry(e); if (!loc || !loc.parent){ toast('本来就在顶层'); return; }
    snapshot('取消缩进');
    loc.list.splice(loc.idx, 1);
    const ploc = findEntry(loc.parent);
    ploc.list.splice(ploc.idx + 1, 0, e);
    toast('已收回顶层'); render();
  }), '');
  mk('📷', need(e => { imgTarget = e; e._imgPending = true; const fi = $('#imgInput'); fi.value = ''; fi.click(); }));
  const sep2 = document.createElement('div'); sep2.className = 'tb-sep'; toolbar.appendChild(sep2);
  mk('撤回', () => {
    if (!undoStack.length){ toast('没有可撤回的操作'); return; }
    const s = undoStack.pop();
    PAGES[TODAY] = s.data; focusRef = null; pendingDel = null;
    render(); toast('已撤回 · ' + s.label);
  });
  mk('删', need(e => {
    const hasHist = e.badge && e.badge.indexOf('>×') === 0;
    if (hasHist && pendingDel !== e){ pendingDel = e; toast('该任务带迁移历史 · 再点一次「删」确认'); return; }
    snapshot('删除');
    removeEntry(e); if (focusRef === e) focusRef = null; pendingDel = null;
    toast('已删除 · 可撤回'); render();
  }), 'warn');
}

/* ============ 抽屉 ============ */

    it.addEventListener('pointerdown', ev => {

      lpT = setTimeout(() => { fired = true; gEdit = {name:g, mode:'reveal'}; pendingGDel = null; buildDrawer(); }, 450);
    });
    it.addEventListener('pointermove', ev => {
      if (sx === null) return;
      if (Math.abs(ev.clientY - sy) > 12) clearTimeout(lpT);
      if (Math.abs(ev.clientX - sx) > 8) moved = true;
      if (ev.clientX - sx < -30 && !fired){
        fired = true; clearTimeout(lpT);
        gEdit = {name:g, mode:'reveal'}; pendingGDel = null; buildDrawer();
      }
    });
    const cancel = () => { clearTimeout(lpT); sx = null; };
    it.addEventListener('pointerup', cancel);
    it.addEventListener('pointerleave', cancel);
    it.addEventListener('click', () => {
      if (fired || moved){ fired = false; return; }
      if (gEdit){ gEdit = null; pendingGDel = null; buildDrawer(); return; }
      cur = {name:'group', g}; closeDrawer(); render();
    });
    box.appendChild(it);
  });
  if (gEdit && gEdit.mode === 'new'){
    const it = document.createElement('div'); it.className = 'd-item';

/* ============ 图片 ============ */
let imgTarget = null;
function compressImg(src, cb){
  const img = new Image();
  img.onload = () => {
    const MX = 1000; let w = img.width, h = img.height;
    if (Math.max(w, h) > MX){ const r = MX / Math.max(w, h); w = Math.round(w * r); h = Math.round(h * r); }
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    try{ cb(cv.toDataURL('image/jpeg', 0.72)); }catch(_){ cb(src); }
  };
  img.onerror = () => cb(src);
  img.src = src;
}
$('#imgInput').addEventListener('change', ev => {
  const fs = [...ev.target.files]; if (!fs.length || !imgTarget) return;
  snapshot('插入图片');
  let left = fs.length;
  fs.forEach(f => {
    const r = new FileReader();
    r.onload = () => compressImg(r.result, out => {
      (imgTarget.images = imgTarget.images || []).push(out);
      if (--left === 0){
        delete imgTarget._imgPending;
        if (!findEntry(imgTarget)) EP().flow.push(imgTarget);
        focusRef = imgTarget;
        toast('已插入图片 · 点缩略图看大图'); render();
      }
    });
    r.readAsDataURL(f);
  });
});
window.addEventListener('focus', () => setTimeout(() => {
  if (imgTarget && imgTarget._imgPending && !(imgTarget.images || []).length) delete imgTarget._imgPending;
}, 800));

  const dt = da[0] + pad(da[1]) + pad(da[2]) + 'T' + pad(tm[0]) + pad(tm[1]) + '00';
  const ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//bujo//CN\r\n'
    + 'BEGIN:VEVENT\r\nUID:' + (e._id || 0) + '-' + dt + '@bujo\r\nDTSTART:' + dt + '\r\n'

    + 'BEGIN:VALARM\r\nACTION:DISPLAY\r\nTRIGGER:-PT0M\r\nDESCRIPTION:点点手帐\r\nEND:VALARM\r\n'
    + 'END:VEVENT\r\nEND:VCALENDAR\r\n';

/* ============ 分组管理 ============ */
let gEdit = null, pendingGDel = null;
function renameGroup(oldN, newN){
  walk((d, e) => { if (e.groups){ const i = e.groups.indexOf(oldN); if (i >= 0) e.groups[i] = newN; } });
  const j = extraGroups.indexOf(oldN);
  if (j >= 0) extraGroups[j] = newN;
}
function deleteGroup(n){
  walk((d, e) => { if (e.groups){ const i = e.groups.indexOf(n); if (i >= 0) e.groups.splice(i, 1); } });
  extraGroups = extraGroups.filter(x => x !== n);
}

/* ============ 报告生成 ============ */
function genReport(g, kind, incMood){
  const ta = TODAY.split('.').map(Number);
  const monday = parseKey(TODAY); monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
  const weekKeys = [];
  for (let i = 0; i < 7; i++){ const d = new Date(monday); d.setDate(monday.getDate() + i); weekKeys.push(dkey(d)); }
  const rangeStr = kind === 'day' ? fmtKey(TODAY)
    : kind === 'week' ? (fmtKey(weekKeys[0]) + '–' + fmtKey(weekKeys[6]))
    : (ta[0] + '年' + ta[1] + '月');
  const label = {day:'日报', week:'周报', month:'月报'}[kind];
  const inR = dk => kind === 'day' ? dk === TODAY
    : kind === 'week' ? weekKeys.includes(dk)
    : dk.startsWith(ta[0] + '.' + ta[1] + '.');
  const cat = {done:[], doing:[], plan:[], drop:[], ev:[], note:[], mood:[]};
  walk((date, e) => {
    if (!(e.groups && e.groups.includes(g)) || !inR(date)) return;
    const dd = fmtShort(date);
    if (e.sym === 'task'){
      if (e.state === 'done') cat.done.push('· ' + e.text + (e.note ? '——' + e.note : '') + '（' + dd + '）');
      else if (e.state === 'dropped') cat.drop.push('· ' + e.text + (e.note ? '——' + e.note : '') + (e.badge ? '（' + e.badge + '）' : ''));
      else if (e.state === 'delegated') cat.doing.push('· ' + e.text + '（已转交' + (e.delegate ? '给 ' + e.delegate.to : '') + '）');
      else if (e.state === 'migrated' && !e.due) return;
      else if (e.state === 'migrated' && e.due && parseKey(e.due) <= parseKey(TODAY)) return;
      else if (e.due && parseKey(e.due) > parseKey(TODAY)) cat.plan.push('· ' + e.text + '（' + fmtShort(e.due) + '）');
      else cat.doing.push('· ' + e.text + (e.badge ? '——' + e.badge : (e.progress ? '——已完成' + e.progress + '%' : '')));
    }
    else if (e.sym === 'event') cat.ev.push('· ' + e.text + '（' + dd + (e.children && e.children.length ? ' · 引发 ' + e.children.length + ' 条' : '') + '）');
    else if (e.sym === 'note') cat.note.push('· ' + e.text);
    else if (e.sym === 'mood') cat.mood.push('· ' + e.text + '（' + dd + '）');
  });
  let out = '【#' + g + ' ' + label + '】' + rangeStr + '\n';
  const sec = (t, a) => { if (a.length) out += '\n' + t + '（' + a.length + '）\n' + a.join('\n') + '\n'; };
  sec('✓ 已完成', cat.done); sec('▶ 进行中', cat.doing); sec('⏭ 已排未来', cat.plan);
  sec('✕ 搁置', cat.drop); sec('○ 相关事件', cat.ev); sec('— 备忘', cat.note);
  if (incMood) sec('= 心情记录', cat.mood);
  if (out.trim().split('\n').length <= 1) out += '\n（该分组在此周期内暂无记录）';
  return out;
}

    out += '\n## ' + k.split('.')[0] + '年' + fmtKey(k) + ' ' + weekCN(k) + '\n';
    const line = (e, ind) => {
      const st = e.state === 'done' ? '✓' : e.state === 'migrated' ? '›'
        : e.state === 'dropped' ? '✕' : e.state === 'delegated' ? '→' : (SY[e.sym] || '•');
      out += ind + st + ' ' + (e.text || '')
        + (e.groups && e.groups.length ? '  #' + e.groups.join(' #') : '')
        + (e.badge ? '（' + e.badge + '）' : '')
        + (e.images && e.images.length ? '（图片×' + e.images.length + '）' : '') + '\n';
      (e.children || []).forEach(c => line(c, ind + '    '));
    };
    if (PAGES[k].plan.length){ out += '### 今天要做\n'; PAGES[k].plan.forEach(e => line(e, '')); }
    if (PAGES[k].flow.length){ out += '### 今天发生\n'; PAGES[k].flow.forEach(e => line(e, '')); }
  });
  const a = document.createElement('a');

/* ============ 导入 Markdown（合并：以现有为准，只补缺） ============ */
function importMD(text){
  const lines = String(text).split(/\r?\n/);
  let curKey = null, section = null, lastTop = null;
  const added = {days:0, items:0};
  for (const raw of lines){
    const h = raw.match(/^##\s*(?:(\d{4})年)?(\d{1,2})月(\d{1,2})日/);
    if (h){
      const y = h[1] ? +h[1] : parseKey(TODAY).getFullYear();
      curKey = y + '.' + (+h[2]) + '.' + (+h[3]);
      if (!PAGES[curKey]){ PAGES[curKey] = {plan:[], flow:[], morningAsked:true}; added.days++; }
      section = null; lastTop = null; continue;
    }
    if (/^###/.test(raw)){ section = raw.indexOf('要做') >= 0 ? 'plan' : 'flow'; lastTop = null; continue; }
    if (!curKey) continue;
    const m = raw.match(/^(\s*)([•○—=✓›✕→])\s+(.*)$/);
    if (!m) continue;
    const indent = m[1].length >= 2;
    let txt = m[3].trim();
    let badge; const bm = txt.match(/（([^（）]+)）\s*$/);
    if (bm){ badge = bm[1]; txt = txt.slice(0, bm.index).trim(); }
    const groups = [];
    txt = txt.replace(/#([^\s#，。,]+)/g, (_, gg) => { groups.push(gg); return ''; }).trim();
    if (!txt){ if (!indent) lastTop = null; continue; }
    const glyph = m[2];
    const sym = glyph === '○' ? 'event' : glyph === '—' ? 'note' : glyph === '=' ? 'mood' : 'task';
    const state = glyph === '✓' ? 'done' : glyph === '›' ? 'migrated' : glyph === '✕' ? 'dropped'
      : glyph === '→' ? 'delegated' : (sym === 'task' ? 'open' : undefined);
    let dup = false;
    walkPage(curKey, e => { if ((e.text || '').trim() === txt) dup = true; });
    if (dup){ if (!indent) lastTop = null; continue; }
    const e = {sym, state, text:txt, _id:++uid};
    if (groups.length) e.groups = groups;
    if (badge) e.badge = badge;
    const page = PAGES[curKey];
    const target = section ? page[section] : (sym === 'task' ? page.plan : page.flow);
    if (indent && lastTop) (lastTop.children = lastTop.children || []).push(e);
    else { target.push(e); lastTop = e; }
    added.items++;
  }
  scheduleSave();
  return added;
}

/* ============ GitHub 云备份 ============ */
let ghTm = null, ghBusy = false, pendingGhRestore = false;
function ghCfg(){ SET.gh = SET.gh || {repo:'', token:'', on:false, last:''}; return SET.gh; }
function ghHeaders(){ return {Authorization:'Bearer ' + ghCfg().token, Accept:'application/vnd.github+json'}; }
function ghPayload(){
  const setCopy = Object.assign({}, SET); delete setCopy.gh;
  return JSON.stringify({pages:PAGES, extraGroups, set:setCopy, seen:SEEN, gcolor:GCOLOR, savedAt:new Date().toISOString()});
}
async function ghPush(manual){
  const c = ghCfg();
  if (!c.repo || !c.token){ if (manual) toast('先填仓库和令牌'); return; }
  if (ghBusy) return; ghBusy = true;
  try{
    const url = 'https://api.github.com/repos/' + c.repo + '/contents/data.json';
    let sha;
    const r0 = await fetch(url, {headers:ghHeaders()});
    if (r0.status === 200){ try{ sha = (await r0.json()).sha; }catch(_){} }
    const body = {message:'点点手帐备份 ' + TODAY, content:btoa(unescape(encodeURIComponent(ghPayload())))};
    if (sha) body.sha = sha;
    const r = await fetch(url, {method:'PUT',
      headers:Object.assign({'Content-Type':'application/json'}, ghHeaders()),
      body:JSON.stringify(body)});
    if (r.ok){
      c.last = fmtKey(TODAY) + ' ' + new Date().toTimeString().slice(0, 5);
      scheduleSave(); if (manual) toast('已备份到云端 ✓');
    } else if (manual) toast('备份失败 ' + r.status + '（检查仓库名 / 令牌权限）');
  }catch(_){ if (manual) toast('网络不通，稍后会自动重试'); }
  ghBusy = false;
}
function ghSchedule(){
  const c = SET.gh;
  if (!c || !c.on || !c.repo || !c.token) return;
  clearTimeout(ghTm); ghTm = setTimeout(() => ghPush(false), 60000);
}
async function ghRestore(){
  const c = ghCfg();
  if (!c.repo || !c.token){ toast('先填仓库和令牌'); return; }
  try{
    const r = await fetch('https://api.github.com/repos/' + c.repo + '/contents/data.json', {headers:ghHeaders()});
    if (!r.ok){ toast('云端还没有备份（' + r.status + '）'); return; }
    const j = await r.json();
    const s = JSON.parse(decodeURIComponent(escape(atob(String(j.content).replace(/\n/g, '')))));
    if (!s.pages) throw 0;
    const keep = ghCfg();
    PAGES = s.pages; extraGroups = s.extraGroups || extraGroups;
    Object.assign(SET, s.set || {}); SET.gh = keep;
    SEEN = s.seen || SEEN; GCOLOR = s.gcolor || {};
    applyAccent(); undoStack = []; focusRef = null;
    ensureToday(); scheduleSave();
    toast('已从云端恢复'); cur = {name:'today'}; render();
  }catch(_){ toast('恢复失败：云端数据无法解析'); }
}

/* ============ 晨间开页 ============ */
function ensureToday(){
  if (!PAGES[TODAY]) PAGES[TODAY] = {plan:[], flow:[]};
  walk((k, e) => { if (e._id && e._id > uid) uid = e._id; });
  walkWithParent((k, e, parent) => {
    if (k === TODAY) return;
    if (e.sym === 'task' && e.due === TODAY && !e.arrived && (e.state === 'open' || e.state === 'migrated')){
      e.arrived = true;
      e.mig = (e.mig || 0) + 1;
      if (e.state === 'open') e.state = 'migrated';
      P().plan.push({sym:'task', state:'open', text:e.text,
        groups:e.groups ? [...e.groups] : undefined, progress:e.progress, mig:e.mig,
        src:e.src || (parent && parent.text) || undefined,
        srcDay:k, srcId:e._id || (e._id = ++uid),
        badge:'>×' + e.mig + (e.progress ? ' · 已完成' + e.progress + '%' : ''), _id:++uid});
    }
    if (e.state === 'delegated' && e.delegate && e.delegate.follow === TODAY && !e.followArrived){
      e.followArrived = true;
      P().plan.push({sym:'task', state:'open',
        text:'问问 ' + e.delegate.to + '：' + (e.text || '').slice(0, 16),
        src:e.text, srcDay:k, srcId:e._id || (e._id = ++uid), _id:++uid});
    }
  });
}
function morningCheck(){
  const page = P(); if (page.morningAsked) return;
  const left = [];
  walkWithParent((k, e, parent) => {
    if (k !== TODAY && e.sym === 'task' && e.state === 'open' && !e.due) left.push({e, parent, k});
  });
  page.morningAsked = true;
  if (!left.length){ scheduleSave(); return; }
  const S = $('#gsheet');
  S.innerHTML = '<div class="gs-title">有 ' + left.length + ' 件事还等着你表态</div>'
    + '<div class="rp-note" style="margin:0 0 12px">'
    + left.slice(0, 3).map(x => '· ' + x.e.text).join('<br>') + (left.length > 3 ? '<br>…' : '') + '</div>'
    + '<button class="gs-done" id="mAll">全部带到今天</button>'
    + '<button class="gm-btn" id="mSkip" style="width:100%;margin-top:10px;padding:10px">先留在原页（长按任务可单独处理）</button>';
  $('#mAll').onclick = () => {
    left.forEach(x => {
      const e = x.e;
      e.state = 'migrated'; e.mig = (e.mig || 0) + 1;
      e.badge = '→' + fmtShort(TODAY) + (e.progress ? ' · 已完成' + e.progress + '%' : '');
      P().plan.push({sym:'task', state:'open', text:e.text,
        groups:e.groups ? [...e.groups] : undefined, progress:e.progress, mig:e.mig,
        src:e.src || (x.parent && x.parent.text) || undefined,
        srcDay:x.k || undefined, srcId:e._id || (e._id = ++uid),
        badge:'>×' + e.mig + (e.progress ? ' · 已完成' + e.progress + '%' : ''), _id:++uid});
    });
    toast('已带来 ' + left.length + ' 件'); closeSheet(); scheduleSave();
  };
  $('#mSkip').onclick = () => closeSheet();
  S.classList.add('on'); $('#mask').classList.add('on');
}
function showOnboard(){
  if (SEEN.onboard) return; SEEN.onboard = true; scheduleSave();
  const R = $('#report');
  R.innerHTML = '<div class="rv-head"><div class="rv-title">你好，我是点点</div></div>'
    + '<div class="rp-body"><div style="text-align:center;padding:18px 0 4px">' + dotSVG(118) + '</div>'
    + '<div class="rp-text">'
    + '我是你每条记录前面的那颗小圆点。这一页像备忘录，点哪写哪，归档交给我。\n\n'
    + '•  待办——点符号打勾，长按推迟 / 放弃 / 转交\n'
    + '○  事件——发生的事；回车能在下面挂子条目，因果自动串成线\n'
    + '—  笔记——想法与信息\n'
    + '＝  心情——此刻的情绪\n\n'
    + '写字敲 # 归分组；「明天」「8.15号」「16:00」这些我都认识。\n'
    + '晚上点右上「复盘」，没做完的事逐件表态——第二天早上我自动接上。\n'
    + '左上 ☰ 是总日历、分组、搜索和设置；设置里可以开云备份，交给我盯着。'
    + '</div><button class="rv-confirm" id="obGo" style="margin-top:14px">开始记录</button></div>';
